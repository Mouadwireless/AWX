---
- name: Network Device Hostname Fetcher
  hosts: all
  gather_facts: false
  vars:
    # Default fallback values if not provided via AWX Extra Vars
    site: "default_site"
    device_role: "default_role"

  tasks:
    - name: Validate required input variables from AWX
      ansible.builtin.assert:
        that:
          - site is defined and site != ""
          - device_role is defined and device_role != ""
        fail_msg: "Please specify both 'site' and 'device_role' when launching the job."
        success_msg: "Running task for Site: '{{ site }}' | Role: '{{ device_role }}'"

    - name: Execute 'show run | inc hostname' command
      ansible.netcommon.cli_command:
        command: show run | inc hostname
      register: cli_output

    - name: Parse hostname from command output
      ansible.builtin.set_fact:
        extracted_hostname: "{{ cli_output.stdout | regex_findall('^hostname\\s+(.+)$', multiline=True) | first | default('Unknown') }}"

    - name: Display host details and retrieved hostname
      ansible.builtin.debug:
        msg:
          - "Target Host IP/Address: {{ inventory_hostname }}"
          - "Site: {{ site }}"
          - "Device Role: {{ device_role }}"
          - "Extracted Hostname: {{ extracted_hostname }}"
